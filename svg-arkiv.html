<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eksempelarkiv</title>
  <link rel="stylesheet" href="/base.css" />
  <link rel="stylesheet" href="/svg-arkiv.css" />
</head>
<body class="svg-archive-page svg-archive-page--compact">
  <main id="main-content" role="main" class="wrap">
    <div class="grid">
      <main class="svg-archive" aria-labelledby="page-title">
        <h1 id="page-title" class="svg-archive__title">Eksempelarkiv</h1>
        <section class="svg-archive__toolbar" data-selection-bar aria-label="Filtrering og valg">
          <section class="svg-archive__controls" aria-label="Filtrering og alternativer">
            <label class="svg-archive__search">
              <span>Søk</span>
              <input
                type="search"
                data-search-input
                aria-label="Søk i arkiv"
                placeholder="Søk i arkiv"
              >
            </label>
            <label class="svg-archive__filter" data-filter-wrapper hidden>
              <span>Filtrer etter verktøy</span>
              <select data-tool-filter>
                <option value="all">Alle verktøy</option>
              </select>
            </label>
            <label class="svg-archive__sort">
              <span>Sorter</span>
              <select data-sort-order>
                <option value="newest">Nyeste først</option>
                <option value="oldest">Eldste først</option>
                <option value="az">A–Å</option>
                <option value="size">Størrelse</option>
              </select>
            </label>
            <label class="svg-archive__size-control" data-size-control>
              <span>Størrelse</span>
              <select data-size-select>
                <option value="small">Liten</option>
                <option value="medium">Middels</option>
                <option value="large">Stor</option>
              </select>
            </label>
            <button
              type="button"
              class="svg-archive__trash-toggle"
              data-trash-toggle
              data-label-default="Vis slettede figurer"
              data-label-active="Skjul slettede figurer"
              aria-expanded="false"
              aria-controls="trash-archive-panel"
            >
              Vis slettede figurer
            </button>
          </section>

          <section class="svg-archive__actions" aria-label="Valg for figurer">
            <p class="svg-archive__selection-count" data-selection-count aria-live="polite" hidden></p>
            <p class="svg-archive__note" data-storage-note hidden></p>
            <div class="svg-archive__actions-buttons">
              <button
                type="button"
                class="svg-archive__actions-button svg-archive__actions-button--danger"
                data-reset-archive
                hidden
              >
                Nullstill arkiv
              </button>
            </div>
          </section>
        </section>

        <p class="svg-archive__status" data-status role="status">Laster eksempelarkivet …</p>

        <section
          id="trash-archive-panel"
          class="svg-archive__trash-panel"
          data-trash-archive
          role="region"
          aria-hidden="true"
          aria-labelledby="trash-archive-title"
          tabindex="-1"
          hidden
        >
          <header class="svg-archive__trash-panel-header">
            <div class="svg-archive__trash-panel-heading">
              <h2 id="trash-archive-title">Slettede figurer</h2>
              <p class="svg-archive__trash-panel-description">
                Figurenes avfallskasse gir deg mulighet til å angre en sletting. Elementene forsvinner permanent når nettleserdata tømmes.
              </p>
            </div>
            <button type="button" class="svg-archive__trash-close" data-trash-close>
              Lukk
            </button>
          </header>
          <p class="svg-archive__trash-panel-status" data-trash-status role="status" aria-live="polite">
            Slettede figurer er skjult.
          </p>
          <div class="svg-archive__trash-list" data-trash-list aria-live="polite">
            <p class="svg-archive__trash-empty" data-trash-empty>Ingen slettede figurer ennå.</p>
          </div>
        </section>

        <ul class="svg-archive__grid" data-svg-grid aria-live="polite" aria-busy="true"></ul>
      </main>
    </div>
  </main>

  <script src="/trash-archive-viewer.js" defer></script>
  <script src="/description-renderer.js" defer></script>
  <script src="/alt-text-ui.js" defer></script>
  <script src="/svg-arkiv.js" defer></script>
</body>
</html>
