<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Brøksirkler</title>
  <link rel="stylesheet" href="/base.css" />

<style>
    :root {
      --pizza-fill:#5B2AA5;
      --pizza-rim:#333333;
      --pizza-dash:#000000;
      --pizza-handle:#e9e6f7;
      --pizza-handle-stroke:var(--pizza-rim, #333333);
    }
    input[type="number"], select { width:100%; box-sizing:border-box; }
    /* Kontainer for pizzaer og tegn mellom dem */
    .grid2 {
      --panel-min: clamp(200px, 28vw, 360px);
      display:flex;
      flex-wrap:wrap;
      gap:clamp(16px,2vw,24px);
      align-items:flex-start;
      justify-content:center;
      padding-bottom:8px;
    }
    .grid2.is-stacked {
      flex-direction:column;
      align-items:center;
    }
    .grid2.is-stacked .pizzaPanel,
    .grid2.is-stacked .opDisplay,
    .grid2.is-stacked .addFigureBtn {
      width:min(100%, 420px);
      align-self:stretch;
    }
    .grid2.is-stacked .pizzaPanel {
      flex:0 1 auto;
      min-width:0;
    }
    .grid2.is-stacked .opDisplay,
    .grid2.is-stacked .addFigureBtn {
      flex:0 0 auto;
      align-self:center;
    }
    .pizzaPanel {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      flex:1 1 var(--panel-min);
      min-width:var(--panel-min);
      max-width:420px;
    }
    .pizzaPanel .removeFigureBtn {
      align-self:center;
    }
    .opDisplay {
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(36px,5vw,60px);
      flex:0 0 clamp(48px,6vw,80px);
      min-height:48px;
      align-self:center;
    }
    .addFigureBtn {
      flex:0 0 clamp(36px,calc(var(--panel-min,220px)*0.35),70px);
      width:min(100%,clamp(36px,calc(var(--panel-min,220px)*0.35),70px));
      aspect-ratio:1;
      border:2px dashed #cfcfcf;
      border-radius:10px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      color:#6b7280;
      cursor:pointer;
      justify-self:center;
      align-self:center;
    }
    .panelHeader { width:100%; display:grid; place-items:center; }
    .frac { font-size:28px; line-height:1; text-align:center; }
    .frac .num { display:block; border-bottom:2px solid #000; margin-bottom:4px; }
    .frac .den { display:block; }
    svg.pizza { width:100%; max-width:420px; height:auto; background:#fff; }
    .rim { fill:none; stroke:var(--pizza-rim, #000000); stroke-width:3; }
    .sector { stroke:var(--pizza-rim, #000000); stroke-width:3; }
    .sector-fill  { fill:var(--pizza-fill, #5B2AA5); }
    .sector-empty { fill:#fff; }
    .dash { stroke:var(--pizza-dash, #000000); stroke-width:3; }
    .handle { cursor:grab; user-select:none; touch-action:none; }
    .handle.is-grabbing { cursor:grabbing; }
    .stepper {
      display:flex; align-items:center; gap:12px;
      padding:6px 10px; border:1px solid #cfcfcf; border-radius:12px;
      box-shadow:0 2px 10px rgba(0,0,0,.06); background:#fff;
    }
    .stepper button {
      width:40px; height:36px; border:1px solid #cfcfcf; border-radius:8px;
      background:#fff; font-size:20px; cursor:pointer;
    }
    .stepper span { min-width:32px; text-align:center; font-variant-numeric:tabular-nums; font-size:16px; }
    .a11y:focus { outline:none; stroke:#1e88e5; stroke-width:3; }
    .status {
      display:none;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid transparent;
      font-size:14px;
      line-height:1.4;
    }
    .status[hidden] { display:none; }
    .status strong { display:block; margin-bottom:4px; }
    .status--success {
      display:block;
      background:#ecfdf5;
      border-color:#a7f3d0;
      color:#065f46;
    }
    .fill-color-picker{display:flex;align-items:center;gap:10px;font-size:13px;color:#4b5563;}
    .fill-color-picker__label{font-weight:500;color:#4b5563;}
    .color-picker{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;}
    .color-swatch--active{
      width:32px;
      height:32px;
      border-radius:50%;
      border:2px solid #fff;
      box-shadow:0 0 0 1px #d1d5db;
      cursor:pointer;
      padding:0;
      transition:transform 0.1s;
    }
    .color-swatch--active:hover{transform:scale(1.1);box-shadow:0 0 0 1px #9ca3af;}
    .color-options{
      position:absolute;
      top:100%;
      left:50%;
      transform:translateX(-50%);
      background:white;
      border:1px solid #e5e7eb;
      border-radius:99px;
      padding:8px;
      display:flex;
      gap:8px;
      box-shadow:0 4px 15px rgba(0,0,0,0.15);
      z-index:100;
      margin-top:8px;
    }
    .color-options::before{
      content:'';
      position:absolute;
      top:-6px;
      left:50%;
      margin-left:-6px;
      border-width:6px;
      border-style:solid;
      border-color:transparent transparent #fff transparent;
    }
    .color-option-btn{
      width:24px;
      height:24px;
      border-radius:50%;
      border:1px solid rgba(0,0,0,0.1);
      cursor:pointer;
      padding:0;
      transition:transform 0.1s;
    }
    .color-option-btn:hover{transform:scale(1.2);}
    .color-option-btn.is-selected{outline:2px solid #6366f1;outline-offset:2px;}
    .color-options[hidden]{display:none !important;}
    .status--error {
      display:block;
      background:#fef2f2;
      border-color:#fecaca;
      color:#991b1b;
    }
    .status--info {
      display:block;
      background:#eff6ff;
      border-color:#bfdbfe;
      color:#1d4ed8;
    }
  </style>
