<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Arealmodell A</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="/vendor/cdn/jsxgraph/jsxgraph.css" />
  

<style>
    #box{width:clamp(280px,60vw,460px);aspect-ratio:1;margin:0 auto;position:relative;}
    .pairs-list{position:absolute;top:10px;right:10px;display:flex;gap:1.2em;text-align:right;pointer-events:none;font-size:16px;line-height:1.2;}
    .pairs-list .col{display:flex;flex-direction:column;gap:4px;}
    .settings{display:flex;flex-direction:column;gap:10px;}
    .settings .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
    .settings .row label{flex:0;}
    .settings .row label input[type="number"]{width:80px;}
    .settings label.chk{flex-direction:row;align-items:center;}
    .settings label.chk input{margin-right:6px;}
  </style>
  <link rel="stylesheet" href="split.css" />
  <script src="/vendor/cdn/jsxgraph/jsxgraphcore.js"></script>
</head>
<body>
  <main id="main-content" role="main" class="wrap">
    <div class="grid layout--sidebar">
      <div class="card">
        <h1 class="sr-only">Arealmodell A</h1>
        <div id="box" class="jxgbox" aria-label="Arealmodell rektangel"></div>
        <div class="toolbar">
          <button id="btnReset" class="btn" type="button">Reset</button>
        </div>
      </div>
      <div class="side">
        <div id="taskPanel" class="card task-panel" hidden>
          <h3>Oppgave</h3>
          <textarea id="taskModeDescription" class="task-text-editable" placeholder="Klikk her for å skrive oppgavetekst..."></textarea>
        </div>

        <div class="card card--examples">
          <div class="example-description">
            <textarea id="exampleDescription" aria-label="Oppgavetekst (valgfritt)" placeholder="Skriv oppgavetekst her"></textarea>
          </div>
          <div class="toolbar">
            <button id="btnUpdateExample" class="btn" type="button">Oppdater</button>
            <button id="btnSaveExample" class="btn" type="button">Lag nytt</button>
          </div>
        </div>
        <div class="card card--settings">
          <div id="settingsMenu" class="settings">
            <div class="row">
              <label>Lengde (celler)
                <input id="lenCells" type="number" value="1" min="1">
              </label>
              <label>Maks lengde
                <input id="lenMax" type="number" value="12" min="1">
              </label>
            </div>
            <div class="row">
              <label>Høyde (celler)
                <input id="heiCells" type="number" value="1" min="1">
              </label>
              <label>Maks høyde
                <input id="heiMax" type="number" value="12" min="1">
              </label>
            </div>
            <label>Snap
              <input id="snap" type="number" value="1" min="1">
            </label>
            <label>Areal-tekst
              <input id="areaLabel" type="text" value="areal">
            </label>
            <label class="chk"><input type="checkbox" id="chkGrid" checked> Vis rutenett</label>
            <div class="row">
              <label class="chk"><input type="checkbox" id="chkChallenge"> Oppgave-modus</label>
              <label>Oppgave-areal
                <input id="challengeArea" type="number" value="12" min="1">
              </label>
            </div>
          </div>
        </div>
        <div class="card">
          <h2>Eksporter</h2>
          <div class="toolbar">
            <button id="btnSvg" class="btn" type="button">Eksporter</button>
            <button id="btnSvgInteractive" class="btn" type="button">Last ned interaktiv SVG</button>
            <button id="btnHtml" class="btn" type="button">Last ned interaktiv HTML</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/palette/palette-config.js"></script>
  <script src="/palette/group-palette.js"></script>
  <script src="/theme/palette.js"></script>
  <script src="/arealmodell0.js"></script>
  <script src="/task-text.js"></script>
  <script src="/examples.js"></script>
  <script src="/split.js"></script>

</body>
</html>
