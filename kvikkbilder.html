<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kvikkbilder</title>
  <link rel="stylesheet" href="base.css" />
  

<style>
    .figure-area{
      position:relative;
      width:min(80vmin,100%);
      align-self:center;
      margin:0 auto;
    }
    .figure-area::before {
      content:"";
      display:block;
      padding-bottom:100%;
      pointer-events:none;
    }
    #brickContainer{
      position:absolute;
      inset:0;
      display:grid;
      gap:10px;
      transform:translateY(-12px);
      align-content:start;
      align-items:center;
      justify-items:center;
      grid-auto-rows:minmax(0,1fr);
    }
    #brickContainer > svg{
      width:auto;
      height:100%;
      max-width:100%;
      max-height:100%;
      display:block;
    }
    #patternContainer,
    #rectangleContainer{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      justify-content:center;
      align-content:center;
      justify-items:center;
      gap:var(--pattern-gap, 18px);
      padding:var(--pattern-padding, 0px);
      grid-template-columns:repeat(1,minmax(0,1fr));
      grid-template-rows:repeat(1,minmax(0,1fr));
      grid-auto-rows:minmax(0,1fr);
    }
    #patternContainer .pattern-item,
    #rectangleContainer .pattern-item{
      width:100%;
      height:100%;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:var(--pattern-item-padding, 12px);
    }
    #patternContainer svg,
    #rectangleContainer svg{width:100%;height:100%;display:block;}
    #patternContainer .pattern-item--figure svg{width:100%;height:100%;display:block;}
    #expression{text-align:center;font-size:24px;font-weight:600;margin-top:var(--gap);}
    input[type="number"], select{width:100%;}
    .field-row{display:grid;gap:10px;}
    .field-row.field-row--two{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
    .field-row.field-row--three{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));}
    .field-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
    .fill-color-picker{display:flex;align-items:center;gap:10px;font-size:13px;color:#4b5563;margin:10px 0 6px;}
    .fill-color-picker__label{font-weight:500;color:#4b5563;}
    .color-picker{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;}
    .color-swatch--active{
      width:32px;
      height:32px;
      border-radius:50%;
      border:2px solid #fff;
      box-shadow:0 0 0 1px #d1d5db;
      cursor:pointer;
      padding:0;
      transition:transform 0.1s;
    }
    .color-swatch--active:hover{transform:scale(1.1);box-shadow:0 0 0 1px #9ca3af;}
    .color-options{
      position:absolute;
      top:100%;
      left:50%;
      transform:translateX(-50%);
      background:white;
      border:1px solid #e5e7eb;
      border-radius:99px;
      padding:8px;
      display:flex;
      gap:8px;
      box-shadow:0 4px 15px rgba(0,0,0,0.15);
      z-index:100;
      margin-top:8px;
    }
    .color-options::before{
      content:'';
      position:absolute;
      top:-6px;
      left:50%;
      margin-left:-6px;
      border-width:6px;
      border-style:solid;
      border-color:transparent transparent #fff transparent;
    }
    .color-option-btn{
      width:24px;
      height:24px;
      border-radius:50%;
      border:1px solid rgba(0,0,0,0.1);
      cursor:pointer;
      padding:0;
      transition:transform 0.1s;
    }
    .color-option-btn:hover{transform:scale(1.2);}
    .color-option-btn.is-selected{outline:2px solid #6366f1;outline-offset:2px;}
    .color-options[hidden]{display:none !important;}
    .checkbox-row{display:flex;align-items:center;gap:6px;}
    #playBtn{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      padding:0;
      font-size:64px;
      cursor:pointer;
      width:160px;
      height:160px;
      border:none;
      border-radius:50%;
      background:var(--play-button, #10b981);
      color:var(--play-button-text, #fff);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 2px 8px rgba(0,0,0,.15);
    }
    #playBtn:hover{
      background:var(--play-button-hover, #059669);
    }
  </style>
  <link rel="stylesheet" href="split.css" />
</head>
<body>
  <main id="main-content" role="main" class="wrap">
    <div class="grid layout--sidebar">
      <div class="card">
        <h1 class="sr-only">Kvikkbilder</h1>
        <div id="figureArea" class="figure-area">
          <button id="playBtn" aria-label="Vis kvikkbilde">▶</button>
          <div id="brickContainer" class="figure" aria-label="Kvikkbilder klosser"></div>
          <div id="patternContainer" class="figure" aria-label="Numbervisuals"></div>
          <div id="rectangleContainer" class="figure" aria-label="Punktrektangler"></div>
        </div>
        <div id="expression"></div>
      </div>
      <div class="side">
        <div id="taskPanel" class="card task-panel" hidden>
          <h3>Oppgave</h3>
          <textarea id="taskModeDescription" class="task-text-editable" placeholder="Klikk her for å skrive oppgavetekst..."></textarea>
        </div>
        <div class="card card--examples">
          <div class="example-description">
            <textarea id="exampleDescription" aria-label="Oppgavetekst (valgfritt)" placeholder="Skriv oppgavetekst her"></textarea>
          </div>
          <div class="toolbar">
            <button id="btnUpdateExample" class="btn" type="button">Oppdater</button>
            <button id="btnSaveExample" class="btn" type="button">Lag nytt</button>
            <button id="btnDeleteExample" class="btn" type="button">Arkiver</button>
            <button id="btnSvg" class="btn" type="button">Eksporter</button>
          </div>
        </div>
        <div class="card card--settings">
          <label>Type
            <select id="cfg-type">
              <option value="klosser">Klosser med knott</option>
              <option value="blocks">Klosser</option>
              <option value="monster" selected>Numbervisuals</option>
              <option value="figurer">Figurer</option>
              <option value="rectangles">Rektangler</option>
            </select>
          </label>
          <div class="fill-color-picker" data-fill-color-picker>
            <span class="fill-color-picker__label">Fyllfarge</span>
            <div class="color-picker">
              <button type="button" class="color-swatch color-swatch--active" aria-label="Velg fyllfarge"></button>
              <div class="color-options" hidden></div>
            </div>
          </div>
          <label>Vis
            <select id="cfg-visibility">
              <option value="always">alltid</option>
              <option value="1">1 sekund</option>
              <option value="2">2 sekunder</option>
              <option value="3">3 sekunder</option>
              <option value="4">4 sekunder</option>
              <option value="5">5 sekunder</option>
              <option value="6">6 sekunder</option>
              <option value="7">7 sekunder</option>
              <option value="8">8 sekunder</option>
              <option value="9">9 sekunder</option>
              <option value="10">10 sekunder</option>
            </select>
          </label>
          <label id="cfg-antall-wrapper">Prikker i én figur
            <input id="cfg-antall" type="number" min="1" value="9">
          </label>
          <div id="klosserConfig">
            <div class="field-row field-row--two">
              <label>Antall figurer i x-retning
                <input id="cfg-antallX" type="number" min="1" value="5">
              </label>
              <label>Antall figurer i y-retning
                <input id="cfg-antallY" type="number" min="1" value="2">
              </label>
            </div>
            <div class="field-row field-row--three">
              <label>Bredde
                <input id="cfg-bredde" type="number" min="1" value="2">
              </label>
              <label>Høyde
                <input id="cfg-hoyde" type="number" min="1" value="3">
              </label>
              <label>Dybde
                <input id="cfg-dybde" type="number" min="1" value="2">
              </label>
            </div>
          </div>
          <div id="monsterConfig">
            <div class="field-row field-row--two">
              <label>Antall figurer i x-retning
                <input id="cfg-monster-antallX" type="number" min="1" value="2">
              </label>
              <label>Antall figurer i y-retning
                <input id="cfg-monster-antallY" type="number" min="1" value="2">
              </label>
            </div>
            <div class="field-grid">
              <label>Punktstørrelse
                <input id="cfg-monster-circleRadius" type="number" min="1" max="60" value="10">
              </label>
              <label>Gruppeavstand
                <input id="cfg-monster-levelScale" type="number" min="0.1" step="0.1" value="1">
              </label>
              <label>Figuravstand
                <input id="cfg-monster-patternGap" type="number" min="0" value="18">
              </label>
            </div>
          </div>
          <div id="rectangleConfig">
            <div class="field-row field-row--two">
              <label>Antall figurer i x-retning
                <input id="cfg-rect-antallX" type="number" min="1" value="2">
              </label>
              <label>Antall figurer i y-retning
                <input id="cfg-rect-antallY" type="number" min="1" value="2">
              </label>
            </div>
            <div class="field-row field-row--two">
              <label>Prikker i bredden
                <input id="cfg-rect-cols" type="number" min="1" value="4">
              </label>
              <label>Prikker i høyden
                <input id="cfg-rect-rows" type="number" min="1" value="3">
              </label>
            </div>
            <div class="field-grid">
              <label>Punktstørrelse
                <input id="cfg-rect-radius" type="number" min="1" max="60" value="8">
              </label>
              <label>Horisontal avstand
                <input id="cfg-rect-spacingX" type="number" min="0" value="6">
              </label>
              <label>Vertikal avstand
                <input id="cfg-rect-spacingY" type="number" min="0" value="6">
              </label>
              <label>Figuravstand
                <input id="cfg-rect-patternGap" type="number" min="0" value="18">
              </label>
            </div>
          </div>
          <div id="figuresConfig">
            <div class="field-row field-row--two">
              <label>Antall figurer i x-retning
                <input id="cfg-figures-antallX" type="number" min="1" value="2">
              </label>
              <label>Antall figurer i y-retning
                <input id="cfg-figures-antallY" type="number" min="1" value="2">
              </label>
            </div>
            <div class="field-grid">
              <label>Figurkategori
                <select id="cfg-figures-category"></select>
              </label>
              <label>Figur
                <select id="cfg-figures-figure"></select>
              </label>
              <label>Figuravstand
                <input id="cfg-figures-patternGap" type="number" min="0" value="18">
              </label>
            </div>
          </div>
          <div class="checkbox-row">
            <input id="cfg-show-expression" type="checkbox" checked>
            <label for="cfg-show-expression">Vis regnestykke</label>
          </div>
        </div>
        <div class="card" id="exportCard">
          <h2>Eksporter</h2>
        </div>
      </div>
    </div>
  </main>
  <script src="/palette/palette-config.js"></script>
  <script src="/theme/palette.js"></script>
  <script src="/theme-profiles.js"></script>
  <script src="/alt-text-ui.js"></script>
  <script src="/svg-export-helper.js"></script>
  <script src="/kvikkbilder.js"></script>
  <script src="/split.js"></script>
  <script src="/examples.js"></script>

</body>
</html>
